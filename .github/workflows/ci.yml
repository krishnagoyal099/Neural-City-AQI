name: Mathematical Rigor CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Typecheck, Lint, and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Mathematical Type Checking
      run: npx tsc --noEmit
      
    - name: Code Linting
      run: npm run lint

    - name: Algorithmic Unit Tests
      run: npm run test

    - name: Production Build Verification
      run: npm run build
